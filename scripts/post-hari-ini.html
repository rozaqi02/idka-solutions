<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 1080px;
      height: 1350px;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #f5efff 0%, #ede3ff 50%, #e6d9ff 100%);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 70px;
    }

    /* Floating background dots */
    .dot {
      position: absolute;
      border-radius: 50%;
      background: #c4b5fd;
      box-shadow: 0 8px 20px rgba(124, 58, 237, 0.15);
    }
    .dot1 { width: 32px; height: 32px; top: 290px; left: 85px; opacity: 0.7; }
    .dot2 { width: 22px; height: 22px; top: 645px; left: 72px; opacity: 0.55; }
    .dot3 { width: 34px; height: 34px; top: 575px; right: 75px; opacity: 0.6; }

    /* Header section */
    .header {
      text-align: center;
      margin-bottom: 45px;
      position: relative;
      z-index: 2;
    }
    .title {
      font-size: 88px;
      font-weight: 900;
      color: #3b0764;
      letter-spacing: -1.5px;
      line-height: 1;
      text-shadow:
        3px 3px 0px #ffffff,
        -3px -3px 0px #ffffff,
        3px -3px 0px #ffffff,
        -3px 3px 0px #ffffff,
        0px 10px 24px rgba(59, 7, 100, 0.18);
    }
    .subtitle-wrapper {
      margin-top: 14px;
      display: inline-block;
      position: relative;
    }
    .subtitle {
      font-size: 38px;
      font-weight: 800;
      color: #2b034e;
      letter-spacing: -0.5px;
    }
    .underline-accent {
      position: absolute;
      bottom: -10px;
      right: 0;
      width: 210px;
      height: 6px;
      background: #5e17eb;
      border-radius: 4px;
    }

    /* Grid layout */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 36px 44px;
      width: 930px;
      position: relative;
      z-index: 2;
    }

    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .photo-frame {
      width: 420px;
      height: 430px;
      background: #3b0764;
      border-radius: 36px;
      padding: 12px;
      box-shadow: 0 16px 36px rgba(59, 7, 100, 0.22);
      position: relative;
      overflow: hidden;
    }

    .card:nth-child(1) .photo-frame { transform: rotate(-2deg); }
    .card:nth-child(2) .photo-frame { transform: rotate(2.2deg); }
    .card:nth-child(3) .photo-frame { transform: rotate(-1.8deg); }
    .card:nth-child(4) .photo-frame { transform: rotate(2deg); }

    .photo-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      border-radius: 26px;
      display: block;
    }

    .info {
      margin-top: 18px;
    }

    .name {
      font-size: 25px;
      font-weight: 800;
      color: #111827;
      line-height: 1.2;
    }

    .role {
      font-size: 21px;
      font-weight: 600;
      color: #374151;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <div class="dot dot1"></div>
  <div class="dot dot2"></div>
  <div class="dot dot3"></div>

  <div class="header">
    <h1 class="title">Kenalan Yuk!</h1>
    <div class="subtitle-wrapper">
      <div class="subtitle">Tim di balik IDKA Solutions</div>
      <div class="underline-accent"></div>
    </div>
  </div>

  <div class="grid">
    <!-- Member 1 -->
    <div class="card">
      <div class="photo-frame">
        <img class="photo-img" src="Ahmad Abror Rozaqi Fatoni.jpg" alt="Ahmad Abror Rozaqi Fatoni">
      </div>
      <div class="info">
        <div class="name">Ahmad Abror Rozaqi Fatoni</div>
        <div class="role">QA + Full Stack Developer</div>
      </div>
    </div>

    <!-- Member 2 -->
    <div class="card">
      <div class="photo-frame">
        <img class="photo-img" src="Faiz Abiyu Atha Fawas.png" alt="Fa'iz Abiyu Atha Fawas">
      </div>
      <div class="info">
        <div class="name">Fa'iz Abiyu Atha Fawas</div>
        <div class="role">Full Stack Developer</div>
      </div>
    </div>

    <!-- Member 3 -->
    <div class="card">
      <div class="photo-frame">
        <img class="photo-img" src="Ervan Dwi Ardian.png" alt="Ervan Dwi Ardian">
      </div>
      <div class="info">
        <div class="name">Ervan Dwi Ardian</div>
        <div class="role">UI/UX</div>
      </div>
    </div>

    <!-- Member 4 -->
    <div class="card">
      <div class="photo-frame">
        <img class="photo-img" src="Agta Fadjrin Aminullah.png" alt="Agta Fadjrin Aminullah">
      </div>
      <div class="info">
        <div class="name">Agta Fadjrin Aminullah</div>
        <div class="role">System Analyst</div>
      </div>
    </div>
  </div>
</body>
</html>
